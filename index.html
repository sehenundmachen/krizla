<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mocracy.de - Live TV Timeline für öffentlich-rechtliche Sender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0a0e27;
            --secondary-bg: #141933;
            --card-bg: #1e2442;
            --hover-bg: #2a3150;
            --accent-color: #4f7cff;
            --text-primary: #ffffff;
            --text-secondary: #a0a9c0;
            --border-color: #2d3654;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --youtube-red: #FF0000;

            /* Sender Colors */
            --ard-color: #2962ff;
            --zdf-color: #ff6d00;
            --arte-color: #e91e63;
            --phoenix-color: #00897b;
            --3sat-color: #5e35b1;
            --br-color: #1976d2;
            --wdr-color: #0288d1;
            --ndr-color: #0097a7;
            --swr-color: #00acc1;
            --hr-color: #26c6da;
            --mdr-color: #00bcd4;
            --rbb-color: #4dd0e1;
            --sr-color: #81d4fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: var(--secondary-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-color), #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--danger);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .current-time {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Category Filter */
        .filter-section {
            padding: 1rem 2rem;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .filter-container {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent-color);
        }

        .filter-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Timeline Container */
        .timeline-wrapper {
            padding: 1.5rem 0;
            height: calc(100vh - 180px);
            overflow: hidden;
        }

        .timeline-controls {
            padding: 0 2rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zoom-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .zoom-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent-color);
        }

        .zoom-level {
            color: var(--text-secondary);
            font-size: 0.85rem;
            min-width: 70px;
            text-align: center;
        }

        /* TV Program Grid - Waipu Style */
        .tv-grid-container {
            position: relative;
            height: calc(100% - 50px);
            overflow-x: auto;
            overflow-y: auto;
            background: var(--secondary-bg);
        }

        .tv-grid {
            position: relative;
            min-width: 100%;
            padding-bottom: 2rem;
        }

        /* Time Ruler */
        .time-ruler {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--secondary-bg);
            border-bottom: 2px solid var(--border-color);
            height: 40px;
            display: flex;
            padding-left: 150px;
        }

        .time-marker {
            position: absolute;
            border-left: 1px solid var(--border-color);
            height: 100%;
            padding: 0.5rem 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .time-marker.now {
            border-left: 2px solid var(--danger);
            color: var(--danger);
            z-index: 10;
        }

        /* Channel Row */
        .channel-row {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            min-height: 80px;
            position: relative;
        }

        .channel-label {
            position: sticky;
            left: 0;
            z-index: 90;
            width: 150px;
            background: var(--card-bg);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            gap: 0.3rem;
        }

        .channel-name {
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
        }

        .channel-type {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
        }

        .youtube-badge {
            background: var(--youtube-red);
            color: white;
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 0.3rem;
            font-weight: 700;
        }

        /* Program Timeline */
        .program-timeline {
            flex: 1;
            position: relative;
            min-height: 80px;
        }

        /* Program Bubble */
        .program-bubble {
            position: absolute;
            top: 5px;
            height: 70px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .program-bubble:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 124, 255, 0.3);
            z-index: 50;
        }

        .program-bubble.live {
            border-color: var(--danger);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(239, 68, 68, 0.1) 100%);
        }

        .program-bubble.youtube {
            border-left: 4px solid var(--youtube-red);
        }

        .program-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 0.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .program-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .program-topic {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: auto;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .live-badge-small {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .live-badge-dot-small {
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        /* Now Line */
        .now-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--danger);
            z-index: 80;
            pointer-events: none;
        }

        .now-line-head {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 12px;
            height: 12px;
            background: var(--danger);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--danger);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Tooltip */
        .program-tooltip {
            position: fixed;
            background: var(--hover-bg);
            border: 2px solid var(--accent-color);
            border-radius: 0.5rem;
            padding: 1rem;
            max-width: 400px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: none;
            pointer-events: none;
        }

        .tooltip-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .tooltip-description {
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .tooltip-actions {
            display: flex;
            gap: 0.5rem;
        }

        .tooltip-btn {
            flex: 1;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 0.4rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tooltip-btn:hover {
            background: #6b8eff;
        }

        .tooltip-btn.secondary {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--secondary-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .channel-label {
                width: 100px;
            }

            .time-ruler {
                padding-left: 100px;
            }

            .program-bubble {
                height: 60px;
                padding: 0.4rem;
            }

            .program-title {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">mocracy.de</h1>
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    <span style="font-weight: 600; font-size: 0.85rem;">LIVE</span>
                </div>
                <div class="current-time" id="currentTime"></div>
            </div>
        </div>
    </header>

    <!-- Category Filter -->
    <section class="filter-section">
        <div class="filter-container">
            <button class="filter-btn active" data-category="all">Alle Sendungen</button>
            <button class="filter-btn" data-category="nachrichten">Nachrichten</button>
            <button class="filter-btn" data-category="talkshow">Talkshows</button>
            <button class="filter-btn" data-category="kommentar">Kommentare & Meinung</button>
            <button class="filter-btn" data-category="dokumentation">Dokumentationen</button>
            <button class="filter-btn" data-category="politik">Politik</button>
        </div>
    </section>

    <!-- Timeline -->
    <section class="timeline-wrapper">
        <div class="timeline-controls">
            <h2 style="font-size: 1.3rem;">TV Programm Timeline</h2>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomOut">-</button>
                <div class="zoom-level" id="zoomLevel">100%</div>
                <button class="zoom-btn" id="zoomIn">+</button>
            </div>
        </div>

        <div class="tv-grid-container" id="tvGridContainer">
            <div class="tv-grid" id="tvGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Lade TV Programm...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Tooltip -->
    <div class="program-tooltip" id="tooltip"></div>

    <script>
        // Configuration
        const API_URL = 'https://mediathekviewweb.de/api/query';
        const YOUTUBE_API_KEY = 'YOUR_API_KEY'; // TODO: Add YouTube API Key

        // Channels Configuration
        const CHANNELS = [
            { id: 'ARD', name: 'ARD', color: 'var(--ard-color)', type: 'TV' },
            { id: 'tagesschau', name: 'tagesschau', color: 'var(--ard-color)', type: 'TV', youtube: 'UC5NOEUbkLheQcaaRldYW5GA' },
            { id: 'ZDF', name: 'ZDF', color: 'var(--zdf-color)', type: 'TV', youtube: 'UCeqKIgPQfNInOswGRWt48kQ' },
            { id: 'Phoenix', name: 'Phoenix', color: 'var(--phoenix-color)', type: 'TV', youtube: 'UCwyiPnNlT8UABRmGmU0T9jg' },
            { id: 'Arte', name: 'Arte', color: 'var(--arte-color)', type: 'TV' },
            { id: '3sat', name: '3sat', color: 'var(--3sat-color)', type: 'TV' },
            { id: 'BR', name: 'BR', color: 'var(--br-color)', type: 'TV' },
            { id: 'WDR', name: 'WDR', color: 'var(--wdr-color)', type: 'TV' },
            { id: 'NDR', name: 'NDR', color: 'var(--ndr-color)', type: 'TV' },
            { id: 'SWR', name: 'SWR', color: 'var(--swr-color)', type: 'TV' },
            { id: 'HR', name: 'HR', color: 'var(--hr-color)', type: 'TV' },
            { id: 'MDR', name: 'MDR', color: 'var(--mdr-color)', type: 'TV' },
            { id: 'RBB', name: 'RBB', color: 'var(--rbb-color)', type: 'TV' },
            { id: 'ZDFinfo', name: 'ZDFinfo', color: 'var(--zdf-color)', type: 'TV' },
            { id: 'tagesschau24', name: 'tagesschau24', color: 'var(--ard-color)', type: 'TV' }
        ];

        // Categories
        const CATEGORIES = {
            nachrichten: ['tagesschau', 'heute', 'nachrichten', 'news', 'journal', 'tagesthemen', 'heute-journal'],
            talkshow: ['maischberger', 'lanz', 'hart aber fair', 'illner', 'talk', 'diskussion', 'anne will'],
            kommentar: ['kommentar', 'meinung', 'standpunkt', 'kolumne', 'heute-show', 'extra 3', 'anstalt'],
            dokumentation: ['doku', 'dokumentation', 'reportage', 'bericht'],
            politik: ['politik', 'bundestag', 'bundesregierung', 'wahlkampf', 'parlament']
        };

        // State
        let currentCategory = 'all';
        let zoomLevel = 100;
        let allPrograms = {};
        let timelineStart = null;
        let timelineEnd = null;
        const PIXELS_PER_MINUTE = 2;

        // DOM
        const tvGrid = document.getElementById('tvGrid');
        const tvGridContainer = document.getElementById('tvGridContainer');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const zoomLevelDisplay = document.getElementById('zoomLevel');
        const currentTimeDisplay = document.getElementById('currentTime');
        const tooltip = document.getElementById('tooltip');

        // Initialize
        init();

        function init() {
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            setupEventListeners();
            fetchAllPrograms();
        }

        function updateCurrentTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
            currentTimeDisplay.innerHTML = `${timeString}<br><small style="font-size: 0.65rem;">${dateString}</small>`;
        }

        function setupEventListeners() {
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                    renderTimeline();
                });
            });

            zoomInBtn.addEventListener('click', () => {
                zoomLevel = Math.min(200, zoomLevel + 20);
                updateZoom();
            });

            zoomOutBtn.addEventListener('click', () => {
                zoomLevel = Math.max(50, zoomLevel - 20);
                updateZoom();
            });
        }

        function updateZoom() {
            zoomLevelDisplay.textContent = `${zoomLevel}%`;
            renderTimeline();
        }

        async function fetchAllPrograms() {
            try {
                const now = new Date();
                const fourHoursAgo = new Date(now.getTime() - 4 * 60 * 60 * 1000);
                const fourHoursLater = new Date(now.getTime() + 4 * 60 * 60 * 1000);

                timelineStart = fourHoursAgo;
                timelineEnd = fourHoursLater;

                // Fetch from MediathekViewWeb API for all channels
                const promises = CHANNELS.map(channel => fetchChannelPrograms(channel.id));
                const results = await Promise.all(promises);

                allPrograms = {};
                results.forEach((programs, index) => {
                    const channelId = CHANNELS[index].id;
                    allPrograms[channelId] = programs.filter(p => matchesCategory(p));
                });

                renderTimeline();
            } catch (error) {
                console.error('Error fetching programs:', error);
                tvGrid.innerHTML = '<div class="loading"><p>Fehler beim Laden</p></div>';
            }
        }

        async function fetchChannelPrograms(channelId) {
            try {
                const requestBody = {
                    queries: [{ fields: ['channel'], query: channelId }],
                    sortBy: 'timestamp',
                    sortOrder: 'desc',
                    future: true,
                    offset: 0,
                    size: 50,
                    duration_min: 3
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                return data.result?.results || [];
            } catch (error) {
                console.error(`Error fetching ${channelId}:`, error);
                return [];
            }
        }

        function matchesCategory(program) {
            if (currentCategory === 'all') return true;
            const keywords = CATEGORIES[currentCategory] || [];
            const searchText = `${program.title} ${program.topic}`.toLowerCase();
            return keywords.some(kw => searchText.includes(kw.toLowerCase()));
        }

        function renderTimeline() {
            if (!timelineStart || !timelineEnd) return;

            const totalMinutes = (timelineEnd - timelineStart) / (1000 * 60);
            const timelineWidth = totalMinutes * PIXELS_PER_MINUTE * (zoomLevel / 100);

            let html = '';

            // Time Ruler
            html += '<div class="time-ruler" style="width: ' + (timelineWidth + 150) + 'px;">';
            for (let i = 0; i <= totalMinutes; i += 30) {
                const time = new Date(timelineStart.getTime() + i * 60 * 1000);
                const x = 150 + (i * PIXELS_PER_MINUTE * (zoomLevel / 100));
                const isNow = Math.abs(time - new Date()) < 15 * 60 * 1000;
                html += `<div class="time-marker ${isNow ? 'now' : ''}" style="left: ${x}px;">${time.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</div>`;
            }
            html += '</div>';

            // Now Line
            const nowX = 150 + calculatePosition(new Date());
            html += `<div class="now-line" style="left: ${nowX}px; height: ${CHANNELS.length * 81}px;"><div class="now-line-head"></div></div>`;

            // Channel Rows
            CHANNELS.forEach(channel => {
                const programs = allPrograms[channel.id] || [];
                html += `
                    <div class="channel-row">
                        <div class="channel-label" style="background: ${channel.color}20;">
                            <div class="channel-name">${channel.name}</div>
                            <div class="channel-type">${channel.type}</div>
                            ${channel.youtube ? '<div class="youtube-badge">YT</div>' : ''}
                        </div>
                        <div class="program-timeline" style="width: ${timelineWidth}px;">
                            ${renderPrograms(programs, channel)}
                        </div>
                    </div>
                `;
            });

            tvGrid.innerHTML = html;
            attachProgramListeners();
        }

        function renderPrograms(programs, channel) {
            const now = Date.now() / 1000;
            return programs.map(program => {
                const startTime = new Date(program.timestamp * 1000);
                const endTime = new Date((program.timestamp + program.duration) * 1000);

                if (endTime < timelineStart || startTime > timelineEnd) return '';

                const left = calculatePosition(startTime);
                const width = calculateWidth(program.duration);
                const isLive = program.timestamp <= now && (program.timestamp + program.duration) >= now;

                return `
                    <div class="program-bubble ${isLive ? 'live' : ''}"
                         style="left: ${left}px; width: ${width}px;"
                         data-program='${JSON.stringify(program)}'>
                        ${isLive ? '<div class="live-badge-small"><div class="live-badge-dot-small"></div>LIVE</div>' : ''}
                        <div class="program-title">${program.title}</div>
                        <div class="program-time">
                            ${startTime.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}
                            - ${endTime.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}
                        </div>
                        <div class="program-topic">${program.topic || ''}</div>
                    </div>
                `;
            }).join('');
        }

        function calculatePosition(date) {
            const minutes = (date - timelineStart) / (1000 * 60);
            return minutes * PIXELS_PER_MINUTE * (zoomLevel / 100);
        }

        function calculateWidth(durationSeconds) {
            const minutes = durationSeconds / 60;
            return Math.max(minutes * PIXELS_PER_MINUTE * (zoomLevel / 100), 80);
        }

        function attachProgramListeners() {
            document.querySelectorAll('.program-bubble').forEach(bubble => {
                bubble.addEventListener('click', (e) => {
                    const program = JSON.parse(bubble.dataset.program);
                    showTooltip(program, e);
                });
            });
        }

        function showTooltip(program, event) {
            const rect = event.target.getBoundingClientRect();
            tooltip.innerHTML = `
                <div class="tooltip-title">${program.title}</div>
                <div class="tooltip-description">${program.description || 'Keine Beschreibung verfügbar.'}</div>
                <div class="tooltip-actions">
                    ${program.url_video ? `<button class="tooltip-btn" onclick="window.open('${program.url_video}', '_blank')">▶️ Abspielen</button>` : ''}
                    ${program.url_website ? `<button class="tooltip-btn secondary" onclick="window.open('${program.url_website}', '_blank')">🔗 Website</button>` : ''}
                </div>
            `;
            tooltip.style.display = 'block';
            tooltip.style.left = Math.min(rect.left, window.innerWidth - 420) + 'px';
            tooltip.style.top = (rect.bottom + 10) + 'px';
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.program-bubble') && !e.target.closest('.program-tooltip')) {
                tooltip.style.display = 'none';
            }
        });

        // Auto-refresh every 5 minutes
        setInterval(fetchAllPrograms, 5 * 60 * 1000);
    </script>
</body>
</html>
