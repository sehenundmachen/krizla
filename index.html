<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mocracy.de - Live TV Timeline für öffentlich-rechtliche Sender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0a0e27;
            --secondary-bg: #141933;
            --card-bg: #1e2442;
            --hover-bg: #2a3150;
            --accent-color: #4f7cff;
            --text-primary: #ffffff;
            --text-secondary: #a0a9c0;
            --border-color: #2d3654;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --youtube-red: #FF0000;
            --future-opacity: 0.4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .header {
            background: var(--secondary-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-color), #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--danger);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .current-time {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .filter-section {
            padding: 1rem 2rem;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .filter-container {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent-color);
        }

        .filter-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .timeline-wrapper {
            padding: 1.5rem 0;
            height: calc(100vh - 180px);
            overflow: hidden;
        }

        .timeline-controls {
            padding: 0 2rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zoom-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .zoom-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent-color);
        }

        .tv-grid-container {
            position: relative;
            height: calc(100% - 50px);
            overflow-x: auto;
            overflow-y: auto;
            background: var(--secondary-bg);
        }

        .tv-grid {
            position: relative;
            min-width: 100%;
            padding-bottom: 2rem;
        }

        .time-ruler {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--secondary-bg);
            border-bottom: 2px solid var(--border-color);
            height: 50px;
            display: flex;
            padding-left: 150px;
            align-items: center;
        }

        .time-grid-line {
            position: absolute;
            border-left: 1px dashed var(--border-color);
            height: 100%;
            opacity: 0.3;
        }

        .now-time-marker {
            position: absolute;
            background: var(--danger);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            transform: translateX(-50%);
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.5);
            z-index: 20;
        }

        .channel-row {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            min-height: 80px;
            position: relative;
        }

        .channel-label {
            position: sticky;
            left: 0;
            z-index: 90;
            width: 150px;
            background: var(--card-bg);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            gap: 0.3rem;
        }

        .channel-name {
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
        }

        .youtube-badge {
            background: var(--youtube-red);
            color: white;
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 0.3rem;
            font-weight: 700;
        }

        .program-timeline {
            flex: 1;
            position: relative;
            min-height: 80px;
        }

        .program-bubble {
            position: absolute;
            top: 5px;
            height: 70px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .program-bubble:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(79, 124, 255, 0.4);
            z-index: 50;
        }

        .program-bubble.live {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(239, 68, 68, 0.15) 100%);
        }

        .program-bubble.future {
            opacity: var(--future-opacity);
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .program-bubble.youtube {
            border-left: 4px solid var(--youtube-red);
        }

        .program-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 0.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .program-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .live-badge-small {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
        }

        .now-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--danger);
            z-index: 80;
            pointer-events: none;
            box-shadow: 0 0 10px var(--danger);
        }

        /* Enhanced Hover Popup */
        .program-popup {
            position: fixed;
            background: var(--hover-bg);
            border: 2px solid var(--accent-color);
            border-radius: 0.75rem;
            width: 450px;
            max-width: 90vw;
            z-index: 2000;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            display: none;
            overflow: hidden;
        }

        .popup-video-preview {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        .popup-video-preview iframe {
            width: 100%;
            height: 100%;
        }

        .popup-video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            padding: 1rem;
            z-index: 10;
        }

        .popup-content {
            padding: 1.5rem;
        }

        .popup-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .popup-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .popup-description {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            max-height: 120px;
            overflow-y: auto;
        }

        .popup-actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .popup-btn {
            flex: 1;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .popup-btn:hover {
            background: #6b8eff;
            transform: translateY(-2px);
        }

        .popup-btn.secondary {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        /* Rating Barometer */
        .rating-section {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-bottom: 1rem;
        }

        .rating-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .rating-buttons {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .rating-option {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--card-bg);
        }

        .rating-option:hover {
            transform: scale(1.05);
        }

        .rating-option.selected {
            border-color: var(--accent-color);
            background: rgba(79, 124, 255, 0.2);
        }

        .rating-icon {
            font-size: 1.8rem;
        }

        .rating-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .rating-count {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* Comment Section */
        .comment-section {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .comment-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .comment-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            margin-bottom: 0.75rem;
        }

        .comment-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .comment-submit {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .comment-submit:hover {
            background: #16a34a;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--secondary-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo">mocracy.de</h1>
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    <span style="font-weight: 600; font-size: 0.85rem;">LIVE</span>
                </div>
                <div class="current-time" id="currentTime"></div>
            </div>
        </div>
    </header>

    <section class="filter-section">
        <div class="filter-container">
            <button class="filter-btn active" data-category="all">Alle</button>
            <button class="filter-btn" data-category="nachrichten">Nachrichten</button>
            <button class="filter-btn" data-category="talkshow">Talkshows</button>
            <button class="filter-btn" data-category="kommentar">Kommentar & Meinung</button>
            <button class="filter-btn" data-category="dokumentation">Dokus</button>
            <button class="filter-btn" data-category="politik">Politik</button>
        </div>
    </section>

    <section class="timeline-wrapper">
        <div class="timeline-controls">
            <h2 style="font-size: 1.3rem;">Live TV Timeline</h2>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomOut">-</button>
                <div style="color: var(--text-secondary); font-size: 0.85rem; min-width: 70px; text-align: center;" id="zoomLevel">100%</div>
                <button class="zoom-btn" id="zoomIn">+</button>
            </div>
        </div>

        <div class="tv-grid-container" id="tvGridContainer">
            <div class="tv-grid" id="tvGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Lade TV Programm...</p>
                </div>
            </div>
        </div>
    </section>

    <div class="program-popup" id="popup"></div>

    <script>
        const API_URL = 'https://mediathekviewweb.de/api/query';

        const CHANNELS = [
            { id: 'ARD', name: 'ARD', youtube: 'UC5NOEUbkLheQcaaRldYW5GA' },
            { id: 'tagesschau', name: 'tagesschau', youtube: 'UC5NOEUbkLheQcaaRldYW5GA' },
            { id: 'ZDF', name: 'ZDF', youtube: 'UCeqKIgPQfNInOswGRWt48kQ' },
            { id: 'Phoenix', name: 'Phoenix', youtube: 'UCwyiPnNlT8UABRmGmU0T9jg' },
            { id: 'Arte', name: 'Arte' },
            { id: '3sat', name: '3sat' },
            { id: 'BR', name: 'BR' },
            { id: 'WDR', name: 'WDR' },
            { id: 'NDR', name: 'NDR' },
            { id: 'SWR', name: 'SWR' },
            { id: 'HR', name: 'HR' },
            { id: 'MDR', name: 'MDR' },
            { id: 'RBB', name: 'RBB' },
            { id: 'SR', name: 'SR' },
            { id: 'DW', name: 'DW' },
            { id: 'ZDFinfo', name: 'ZDFinfo' },
            { id: 'tagesschau24', name: 'tagesschau24' }
        ];

        const CATEGORIES = {
            nachrichten: ['tagesschau', 'heute', 'nachrichten', 'news', 'journal', 'tagesthemen'],
            talkshow: ['maischberger', 'lanz', 'hart aber fair', 'illner', 'talk', 'anne will'],
            kommentar: ['kommentar', 'meinung', 'standpunkt', 'heute-show', 'extra 3', 'anstalt'],
            dokumentation: ['doku', 'dokumentation', 'reportage'],
            politik: ['politik', 'bundestag', 'bundesregierung', 'parlament']
        };

        let currentCategory = 'all';
        let zoomLevel = 100;
        let allPrograms = {};
        let youtubeVideos = {};
        let timelineStart = null;
        let timelineEnd = null;
        let userRatings = JSON.parse(localStorage.getItem('ratings') || '{}');
        let userComments = JSON.parse(localStorage.getItem('comments') || '{}');
        const PIXELS_PER_MINUTE = 2;

        const tvGrid = document.getElementById('tvGrid');
        const popup = document.getElementById('popup');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const currentTimeDisplay = document.getElementById('currentTime');

        init();

        function init() {
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            setupEventListeners();
            fetchAllData();
        }

        function updateCurrentTime() {
            const now = new Date();
            currentTimeDisplay.innerHTML = `${now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}<br><small style="font-size: 0.65rem;">${now.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' })}</small>`;
        }

        function setupEventListeners() {
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                    renderTimeline();
                });
            });

            document.getElementById('zoomIn').addEventListener('click', () => {
                zoomLevel = Math.min(200, zoomLevel + 20);
                document.getElementById('zoomLevel').textContent = `${zoomLevel}%`;
                renderTimeline();
            });

            document.getElementById('zoomOut').addEventListener('click', () => {
                zoomLevel = Math.max(50, zoomLevel - 20);
                document.getElementById('zoomLevel').textContent = `${zoomLevel}%`;
                renderTimeline();
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.program-bubble') && !e.target.closest('.program-popup')) {
                    popup.style.display = 'none';
                }
            });
        }

        async function fetchAllData() {
            const now = new Date();
            timelineStart = new Date(now.getTime() - 4 * 60 * 60 * 1000);
            timelineEnd = new Date(now.getTime() + 8 * 60 * 60 * 1000);

            const tvPromises = CHANNELS.map(ch => fetchChannelPrograms(ch.id));
            const ytPromises = CHANNELS.filter(ch => ch.youtube).map(ch => fetchYouTubeVideos(ch.youtube, ch.id));

            const [tvResults, ytResults] = await Promise.all([
                Promise.all(tvPromises),
                Promise.all(ytPromises)
            ]);

            allPrograms = {};
            tvResults.forEach((programs, i) => {
                allPrograms[CHANNELS[i].id] = programs.filter(p => matchesCategory(p));
            });

            renderTimeline();
        }

        async function fetchChannelPrograms(channelId) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        queries: [{ fields: ['channel'], query: channelId }],
                        sortBy: 'timestamp',
                        sortOrder: 'desc',
                        future: true,
                        offset: 0,
                        size: 60,
                        duration_min: 3
                    })
                });
                const data = await response.json();
                return data.result?.results || [];
            } catch (error) {
                console.error(`Error: ${channelId}`, error);
                return [];
            }
        }

        async function fetchYouTubeVideos(channelId, name) {
            try {
                const response = await fetch(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const entries = xml.querySelectorAll('entry');

                const videos = Array.from(entries).slice(0, 5).map(entry => {
                    const published = new Date(entry.querySelector('published').textContent);
                    return {
                        id: entry.querySelector('videoId').textContent,
                        title: entry.querySelector('title').textContent,
                        description: entry.querySelector('media\\:description, description').textContent,
                        timestamp: Math.floor(published.getTime() / 1000),
                        duration: 1800,
                        channel: name,
                        topic: 'YouTube',
                        url_video: `https://www.youtube.com/watch?v=${entry.querySelector('videoId').textContent}`,
                        isYouTube: true
                    };
                });

                if (!youtubeVideos[name]) youtubeVideos[name] = [];
                youtubeVideos[name] = videos;
                return videos;
            } catch (error) {
                console.error(`YT Error: ${name}`, error);
                return [];
            }
        }

        function matchesCategory(program) {
            if (currentCategory === 'all') return true;
            const keywords = CATEGORIES[currentCategory] || [];
            const text = `${program.title} ${program.topic}`.toLowerCase();
            return keywords.some(kw => text.includes(kw.toLowerCase()));
        }

        function renderTimeline() {
            if (!timelineStart || !timelineEnd) return;

            const totalMinutes = (timelineEnd - timelineStart) / (1000 * 60);
            const timelineWidth = totalMinutes * PIXELS_PER_MINUTE * (zoomLevel / 100);
            const now = Date.now() / 1000;

            let html = '<div class="time-ruler" style="width: ' + (timelineWidth + 150) + 'px;">';

            // Grid lines every hour
            for (let i = 0; i <= totalMinutes; i += 60) {
                const x = 150 + (i * PIXELS_PER_MINUTE * (zoomLevel / 100));
                html += `<div class="time-grid-line" style="left: ${x}px; height: ${CHANNELS.length * 81}px;"></div>`;
            }

            // NOW marker
            const nowX = 150 + calculatePosition(new Date());
            html += `<div class="now-time-marker" style="left: ${nowX}px;">JETZT ${new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</div>`;
            html += '</div>';

            // NOW line
            html += `<div class="now-line" style="left: ${nowX}px; height: ${CHANNELS.length * 81}px;"></div>`;

            // Channels
            CHANNELS.forEach(channel => {
                const programs = allPrograms[channel.id] || [];
                const ytVideos = youtubeVideos[channel.id] || [];
                const combined = [...programs, ...ytVideos].sort((a, b) => a.timestamp - b.timestamp);

                html += `
                    <div class="channel-row">
                        <div class="channel-label">
                            <div class="channel-name">${channel.name}</div>
                            ${channel.youtube ? '<div class="youtube-badge">YT</div>' : ''}
                        </div>
                        <div class="program-timeline" style="width: ${timelineWidth}px;">
                            ${renderPrograms(combined, now)}
                        </div>
                    </div>
                `;
            });

            tvGrid.innerHTML = html;
            attachListeners();
        }

        function renderPrograms(programs, now) {
            return programs.map(p => {
                const start = new Date(p.timestamp * 1000);
                const end = new Date((p.timestamp + p.duration) * 1000);
                if (end < timelineStart || start > timelineEnd) return '';

                const left = calculatePosition(start);
                const width = calculateWidth(p.duration);
                const isLive = p.timestamp <= now && (p.timestamp + p.duration) >= now;
                const isFuture = p.timestamp > now;

                return `
                    <div class="program-bubble ${isLive ? 'live' : ''} ${isFuture ? 'future' : ''} ${p.isYouTube ? 'youtube' : ''}"
                         style="left: ${left}px; width: ${width}px;"
                         data-program='${JSON.stringify(p).replace(/'/g, "&apos;")}'>
                        ${isLive ? '<div class="live-badge-small">LIVE</div>' : ''}
                        <div class="program-title">${p.title}</div>
                        <div class="program-time">${start.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</div>
                    </div>
                `;
            }).join('');
        }

        function calculatePosition(date) {
            return ((date - timelineStart) / (1000 * 60)) * PIXELS_PER_MINUTE * (zoomLevel / 100);
        }

        function calculateWidth(duration) {
            return Math.max((duration / 60) * PIXELS_PER_MINUTE * (zoomLevel / 100), 80);
        }

        function attachListeners() {
            document.querySelectorAll('.program-bubble:not(.future)').forEach(bubble => {
                bubble.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const program = JSON.parse(bubble.dataset.program.replace(/&apos;/g, "'"));
                    showPopup(program, e);
                });
            });
        }

        function showPopup(program, event) {
            const videoId = program.isYouTube ? program.id : extractVideoId(program.url_video);
            const embedUrl = videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=0&mute=1` : '';

            const ratings = userRatings[program.id] || { positive: 0, neutral: 0, negative: 0 };
            const userRating = ratings.userChoice || null;

            popup.innerHTML = `
                ${embedUrl ? `
                    <div class="popup-video-preview">
                        <iframe src="${embedUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        <div class="popup-video-overlay">
                            <div style="background: var(--danger); display: inline-block; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.7rem; font-weight: 700;">VORSCHAU</div>
                        </div>
                    </div>
                ` : ''}
                <div class="popup-content">
                    <div class="popup-title">${program.title}</div>
                    <div class="popup-meta">
                        <span>📺 ${program.channel}</span>
                        <span>🕐 ${new Date(program.timestamp * 1000).toLocaleString('de-DE')}</span>
                    </div>
                    <div class="popup-description">${program.description || 'Keine Beschreibung verfügbar.'}</div>

                    <div class="popup-actions">
                        ${program.url_video ? `<button class="popup-btn" onclick="window.open('${program.url_video}', '_blank')">▶️ Abspielen</button>` : ''}
                        ${program.url_website ? `<button class="popup-btn secondary" onclick="window.open('${program.url_website}', '_blank')">🔗 Info</button>` : ''}
                    </div>

                    <div class="rating-section">
                        <div class="rating-title">Stimmungsbarometer</div>
                        <div class="rating-buttons">
                            <div class="rating-option ${userRating === 'positive' ? 'selected' : ''}" onclick="rate('${program.id}', 'positive')">
                                <div class="rating-icon">👍</div>
                                <div class="rating-label">Gut</div>
                                <div class="rating-count">${ratings.positive || 0}</div>
                            </div>
                            <div class="rating-option ${userRating === 'neutral' ? 'selected' : ''}" onclick="rate('${program.id}', 'neutral')">
                                <div class="rating-icon">😐</div>
                                <div class="rating-label">OK</div>
                                <div class="rating-count">${ratings.neutral || 0}</div>
                            </div>
                            <div class="rating-option ${userRating === 'negative' ? 'selected' : ''}" onclick="rate('${program.id}', 'negative')">
                                <div class="rating-icon">👎</div>
                                <div class="rating-label">Schlecht</div>
                                <div class="rating-count">${ratings.negative || 0}</div>
                            </div>
                        </div>
                    </div>

                    <div class="comment-section">
                        <div class="comment-title">Dein Kommentar zur Sendung</div>
                        <textarea class="comment-input" id="commentInput" placeholder="Teile deine Meinung zur Sendung...">${userComments[program.id] || ''}</textarea>
                        <button class="comment-submit" onclick="saveComment('${program.id}')">💬 Kommentar speichern</button>
                    </div>
                </div>
            `;

            popup.style.display = 'block';
            const rect = event.target.getBoundingClientRect();
            popup.style.left = Math.min(rect.left, window.innerWidth - 470) + 'px';
            popup.style.top = Math.min(rect.bottom + 10, window.innerHeight - 600) + 'px';
        }

        function extractVideoId(url) {
            if (!url) return null;
            const match = url.match(/[?&]v=([^&]+)/);
            return match ? match[1] : null;
        }

        window.rate = function(programId, choice) {
            if (!userRatings[programId]) {
                userRatings[programId] = { positive: 0, neutral: 0, negative: 0 };
            }

            const prev = userRatings[programId].userChoice;
            if (prev) userRatings[programId][prev]--;

            userRatings[programId][choice]++;
            userRatings[programId].userChoice = choice;

            localStorage.setItem('ratings', JSON.stringify(userRatings));

            document.querySelectorAll('.rating-option').forEach(opt => opt.classList.remove('selected'));
            event.target.closest('.rating-option').classList.add('selected');

            document.querySelectorAll('.rating-count').forEach((el, i) => {
                const keys = ['positive', 'neutral', 'negative'];
                el.textContent = userRatings[programId][keys[i]];
            });
        };

        window.saveComment = function(programId) {
            const comment = document.getElementById('commentInput').value;
            userComments[programId] = comment;
            localStorage.setItem('comments', JSON.stringify(userComments));
            alert('Kommentar gespeichert! 💬\n\n(In der finalen Version wird dies an einen Server gesendet)');
        };

        setInterval(fetchAllData, 5 * 60 * 1000);
    </script>
</body>
</html>
